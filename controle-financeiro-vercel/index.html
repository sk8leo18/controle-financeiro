<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1826" />
    <meta name="color-scheme" content="light" id="color-scheme-meta" />

    <!-- PWA: faz o app abrir em tela cheia, sem barra do navegador -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Financeiro" />

    <title>Controle Financeiro</title>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("financas-theme");
          var dark = saved === "dark" || (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          var paper = dark ? "#12181A" : "#E4E8E2";
          document.documentElement.style.colorScheme = theme;
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.background = paper;
          var schemeMeta = document.getElementById("color-scheme-meta");
          if (schemeMeta) schemeMeta.setAttribute("content", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
